<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>418 I'm a Teapot | CrimsonFlame</title>
    <link rel="stylesheet" href="/style.css?v=8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .error-viewport {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 20px 40px;
            position: relative;
            z-index: 10;
        }

        .error-card {
            background: rgba(20, 11, 16, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(220, 38, 38, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 40px rgba(220, 38, 38, 0.25);
            border-radius: 24px;
            max-width: 540px;
            width: 100%;
            padding: 42px 32px 36px;
            text-align: center;
            position: relative;
        }

        .error-code-badge {
            font-family: var(--font-heading);
            font-size: 5.2rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff4d6d 0%, #dc2626 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(220, 38, 38, 0.4);
            letter-spacing: -2px;
        }

        .error-subtitle {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .error-desc {
            color: var(--text-secondary);
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        /* ─── INTERACTIVE TEAPOT & CUP STAGE ─── */
        .teapot-stage {
            position: relative;
            height: 190px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto 24px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 45px;
            user-select: none;
        }

        /* Teapot Wrapper */
        .teapot-wrapper {
            position: relative;
            cursor: pointer;
            transform-origin: bottom right;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 8px 20px rgba(220, 38, 38, 0.3));
        }

        .teapot-wrapper:hover {
            transform: scale(1.05);
        }

        .teapot-wrapper.pouring {
            transform: rotate(-38deg) translateY(-10px) translateX(-5px);
        }

        .teapot-svg {
            width: 130px;
            height: 115px;
            display: block;
        }

        /* Click Me Hint Tooltip */
        .click-hint {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9);
            color: #ffffff;
            font-family: var(--font-heading);
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
            pointer-events: none;
            animation: bounce 1.8s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -6px); }
        }

        /* Coffee Liquid Stream */
        .coffee-stream {
            position: absolute;
            top: 72px;
            left: 100px;
            width: 6px;
            height: 0;
            background: linear-gradient(to bottom, #5c2c16, #3b1709);
            border-radius: 3px;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: height 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 0 8px rgba(92, 44, 22, 0.8);
        }

        .coffee-stream.active {
            height: 68px;
            opacity: 1;
        }

        /* Cup & Saucer */
        .cup-wrapper {
            position: relative;
            width: 90px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));
        }

        .cup-body {
            position: relative;
            width: 70px;
            height: 52px;
            background: linear-gradient(135deg, #1f1218, #12090e);
            border: 2px solid rgba(220, 38, 38, 0.5);
            border-top: none;
            border-radius: 0 0 24px 24px;
            overflow: hidden;
            box-shadow: inset 0 -4px 12px rgba(0, 0, 0, 0.6);
        }

        /* Cup Handle */
        .cup-handle {
            position: absolute;
            right: 0;
            top: 32px;
            width: 18px;
            height: 28px;
            border: 3px solid rgba(220, 38, 38, 0.5);
            border-left: none;
            border-radius: 0 14px 14px 0;
        }

        /* Saucer */
        .cup-saucer {
            width: 86px;
            height: 8px;
            background: linear-gradient(to bottom, #2d1822, #160a10);
            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 8px;
            margin-top: 2px;
        }

        /* Liquid in Cup */
        .cup-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #2b1106 0%, #4a210f 80%, #a2653e 100%);
            transition: height 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 0 0 20px 20px;
        }

        .cup-foam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(214, 161, 122, 0.7);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cup-liquid.has-coffee .cup-foam {
            opacity: 1;
        }

        /* Steam Animation */
        .steam-container {
            position: absolute;
            top: -20px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .steam-container.visible {
            opacity: 0.85;
        }

        .steam-particle {
            width: 4px;
            height: 18px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 4px;
            filter: blur(2px);
            animation: riseSteam 2s infinite ease-out;
        }

        .steam-particle:nth-child(2) {
            animation-delay: 0.6s;
            height: 24px;
        }

        .steam-particle:nth-child(3) {
            animation-delay: 1.2s;
            height: 16px;
        }

        @keyframes riseSteam {
            0% { transform: translateY(0) scaleX(1); opacity: 0.6; }
            50% { transform: translateY(-16px) scaleX(1.8); opacity: 0.3; }
            100% { transform: translateY(-32px) scaleX(2.5); opacity: 0; }
        }

        /* Interactive Status Toast */
        .teapot-status-msg {
            font-family: var(--font-heading);
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--crimson-light, #f87171);
            min-height: 24px;
            margin-bottom: 22px;
            transition: all 0.2s ease;
        }

        /* Actions */
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-pour-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(220, 38, 38, 0.18);
            border: 1px solid rgba(220, 38, 38, 0.45);
            color: #ffffff;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.92rem;
            padding: 11px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-pour-toggle:hover {
            background: rgba(220, 38, 38, 0.35);
            border-color: #ef4444;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--crimson, #dc2626);
            color: #fff;
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.92rem;
            padding: 12px 30px;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(220, 38, 38, 0.4);
        }

        .btn-back:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(220, 38, 38, 0.6);
        }
    </style>
</head>
<body>

    <!-- Global Custom Crimson Loading Animation -->
    <div id="page-loader">
        <img src="/assets/loading.gif" alt="Loading..." class="loader-video">
        <div class="loader-title">CrimsonFlame</div>
    </div>
    <script>
        function hidePageLoader() {
            var l = document.getElementById('page-loader');
            if (l) {
                l.classList.add('fade-out');
                setTimeout(function() { l.style.display = 'none'; }, 400);
            }
        }
        window.addEventListener('DOMContentLoaded', hidePageLoader);
        window.addEventListener('load', hidePageLoader);
        setTimeout(hidePageLoader, 1500);
    </script>

    <!-- Ambient Background Elements -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="particles" id="particles"></div>

    <!-- Floating Navigation Pill -->
    <nav class="pill-nav">
        <a href="/index.html" class="pill-brand">
            <img src="https://i.ibb.co/TBkJR2Jn/unnamed-removebg-preview.png" alt="CF" class="pill-brand-logo">
            <span class="pill-brand-text">CrimsonFlame</span>
        </a>
        <a href="/projects" class="pill-link">Projects</a>
        <a href="/crimx" class="pill-link">CrimX</a>
        <a href="https://discord.gg/tNK8z9gYGQ" class="pill-cta" target="_blank">
            <svg width="18" height="14" viewBox="0 0 24 18" fill="currentColor"><path d="M20.317 1.492a19.7 19.7 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.7 19.7 0 0 0 3.677 1.492a.07.07 0 0 0-.032.027C.533 6.093-.32 10.555.099 14.961a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03z"/></svg>
            <span>Discord</span>
        </a>
    </nav>

    <!-- Main Viewport -->
    <main class="error-viewport">
        <div class="error-card">
            <div class="error-code-badge">418</div>
            <h1 class="error-subtitle">I'm a Teapot</h1>
            <p class="error-desc" id="status-desc">
                The server refuses the attempt to brew coffee with a teapot, or you are a stupid ai bot. Get off.
            </p>

            <!-- Interactive Stage -->
            <div class="teapot-stage">
                <!-- Teapot Element -->
                <div class="teapot-wrapper" id="teapot" title="Click me to pour coffee!">
                    <div class="click-hint" id="click-hint">Click Me! 🫖</div>
                    
                    <!-- Stylized Crimson Teapot SVG -->
                    <svg class="teapot-svg" viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Lid Knob -->
                        <circle cx="68" cy="22" r="6" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
                        <!-- Lid -->
                        <path d="M48 30C48 25 88 25 88 30Z" fill="#b91c1c" stroke="#dc2626" stroke-width="2"/>
                        <!-- Teapot Body -->
                        <ellipse cx="68" cy="68" rx="44" ry="34" fill="url(#teapotGrad)" stroke="#ef4444" stroke-width="2.5"/>
                        <!-- Body Accent Flame Line -->
                        <path d="M42 66C54 78 82 78 94 66" stroke="rgba(254, 202, 202, 0.4)" stroke-width="2" stroke-linecap="round"/>
                        <!-- Handle -->
                        <path d="M26 50C10 50 8 84 26 84" stroke="#dc2626" stroke-width="6" stroke-linecap="round" fill="none"/>
                        <!-- Spout -->
                        <path d="M102 62C118 62 126 42 124 38C120 38 112 50 102 54Z" fill="#b91c1c" stroke="#ef4444" stroke-width="2" stroke-linejoin="round"/>
                        <!-- Base -->
                        <rect x="48" y="98" width="40" height="6" rx="3" fill="#991b1b" stroke="#dc2626" stroke-width="1.5"/>

                        <defs>
                            <linearGradient id="teapotGrad" x1="30" y1="36" x2="106" y2="100" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#ef4444"/>
                                <stop offset="0.5" stop-color="#b91c1c"/>
                                <stop offset="1" stop-color="#450a0a"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <!-- Liquid Flowing Stream -->
                <div class="coffee-stream" id="coffee-stream"></div>

                <!-- Coffee Cup Element -->
                <div class="cup-wrapper" id="cup">
                    <div class="steam-container" id="cup-steam">
                        <div class="steam-particle"></div>
                        <div class="steam-particle"></div>
                        <div class="steam-particle"></div>
                    </div>
                    <div class="cup-handle"></div>
                    <div class="cup-body">
                        <div class="cup-liquid" id="cup-liquid">
                            <div class="cup-foam"></div>
                        </div>
                    </div>
                    <div class="cup-saucer"></div>
                </div>
            </div>

            <!-- Toast / Subtitle Status Message -->
            <div class="teapot-status-msg" id="teapot-status">
                Click the teapot to try brewing coffee...
            </div>

            <div class="error-actions">
                <button class="btn-pour-toggle" id="btn-pour">
                    <span>🫖 Pour Coffee</span>
                </button>
                <a href="/index.html" class="btn-back">Back to Home</a>
            </div>
        </div>
    </main>

    <script>
        // Interactive Teapot Pouring Logic
        const teapot = document.getElementById('teapot');
        const coffeeStream = document.getElementById('coffee-stream');
        const cupLiquid = document.getElementById('cup-liquid');
        const cupSteam = document.getElementById('cup-steam');
        const statusMsg = document.getElementById('teapot-status');
        const clickHint = document.getElementById('click-hint');
        const btnPour = document.getElementById('btn-pour');

        let fillLevel = 0; // 0, 45, 90
        let isPouring = false;
        let pourCount = 0;

        // Subtle Web Audio API sound synthesizer
        let audioCtx;
        function playPourSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                // Gentle bubbling/liquid noise
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(280 + fillLevel * 3, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(420 + fillLevel * 4, audioCtx.currentTime + 0.6);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.65);
            } catch (e) {
                // Audio synthesis optional
            }
        }

        function pourCoffee() {
            if (isPouring) return;
            isPouring = true;
            pourCount++;
            if (clickHint) clickHint.style.display = 'none';

            // 1. Tilt teapot
            teapot.classList.add('pouring');
            statusMsg.textContent = "Tipping teapot... pouring hot coffee!";
            statusMsg.style.color = "#fbbf24";

            // 2. Start coffee stream after tilt begins
            setTimeout(() => {
                coffeeStream.classList.add('active');
                playPourSound();

                // 3. Increase liquid in cup
                setTimeout(() => {
                    if (fillLevel < 90) {
                        fillLevel += 45;
                    } else {
                        // Reset if overfilled
                        fillLevel = 35;
                    }

                    cupLiquid.style.height = fillLevel + '%';
                    cupLiquid.classList.add('has-coffee');
                    cupSteam.classList.add('visible');

                    // 4. Return teapot to rest
                    setTimeout(() => {
                        coffeeStream.classList.remove('active');
                        teapot.classList.remove('pouring');
                        isPouring = false;

                        if (fillLevel >= 85) {
                            statusMsg.textContent = "⚠️ Error 418: Wait! I am a TEAPOT, not a coffee machine!";
                            statusMsg.style.color = "#ef4444";
                            btnPour.innerHTML = "<span>🔄 Empty Cup</span>";
                        } else {
                            statusMsg.textContent = "Poured a splash of coffee! Click again to fill.";
                            statusMsg.style.color = "#4ade80";
                            btnPour.innerHTML = "<span>🫖 Pour More</span>";
                        }
                    }, 400);

                }, 400);
            }, 250);
        }

        teapot.addEventListener('click', () => {
            if (fillLevel >= 85 && !isPouring) {
                // Reset
                fillLevel = 0;
                cupLiquid.style.height = '0%';
                cupLiquid.classList.remove('has-coffee');
                cupSteam.classList.remove('visible');
                statusMsg.textContent = "Cup emptied! Click the teapot to brew again.";
                statusMsg.style.color = "#a39ca0";
                btnPour.innerHTML = "<span>🫖 Pour Coffee</span>";
            } else {
                pourCoffee();
            }
        });

        btnPour.addEventListener('click', () => {
            if (fillLevel >= 85 && !isPouring) {
                fillLevel = 0;
                cupLiquid.style.height = '0%';
                cupLiquid.classList.remove('has-coffee');
                cupSteam.classList.remove('visible');
                statusMsg.textContent = "Cup emptied! Click the teapot to brew again.";
                statusMsg.style.color = "#a39ca0";
                btnPour.innerHTML = "<span>🫖 Pour Coffee</span>";
            } else {
                pourCoffee();
            }
        });
    </script>
</body>
</html>
